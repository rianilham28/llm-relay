[package]
name = "llm-relay"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Slim OpenAI-compatible chat-completions relay: direct pooled fetch, pass-through wire, no ops machinery"

# A lib + bin split, so the pure wire modules keep their host tests while the
# binary owns the runtime.
[lib]
name = "llm_relay"
path = "src/lib.rs"

[[bin]]
name = "llm-relay"
path = "src/main.rs"

[dependencies]
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["http1", "http2", "server", "client"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1", "http2", "webpki-tokio", "aws-lc-rs", "tls12"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "server-auto", "server-graceful", "http1", "http2", "tokio"] }
memchr = "2.8.3"
mimalloc = "0.1.52"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "time", "signal"] }

[dev-dependencies]
# Tests only: proves the hand-written envelopes really are valid JSON.
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# NOT `abort`: a panic must take down one connection's task, not the process.
panic = "unwind"
