# The tuned build for a scale-to-zero container. Nightly-only: every cargo
# command here inherits these flags, so `cargo` must resolve to nightly
# (`rust-toolchain.toml` pins it). Both Docker build stages COPY this file, so
# the flags have exactly one definition; each stage adds only its `-Cprofile-*`.
#
# Measured, and kept because it was measured:
#   build-std          rebuilds std under this crate's fat LTO and opt-level
#   location-detail    drops the file/line/col strings behind every panic
#   fmt-debug          empties derived Debug impls; this crate formats with
#                      Display only, so nothing in `src/` loses output
#
# `-Ztune-cpu=native` was measured here and rejected: indistinguishable from
# noise on an interleaved A/B, and it would bake the builder's microarchitecture
# into a multi-arch image. `panic_immediate_abort` is not available either — the
# relay's panic behaviour is load-bearing (a panic must take down one
# connection's task, not the process).
[unstable]
build-std = ["std", "panic_unwind", "proc_macro"]

[build]
rustflags = ["-Zlocation-detail=none", "-Zfmt-debug=none"]
